{% extends 'base.html' %}

{% block title %}
Product List
{% endblock %}

{% block content %}

<h1>Product List</h1>

<table border="1">

    <tr>
        <th>Name</th>
        <th>Production Date</th>
        <th>Price</th>
    </tr>

    {% for product in products %}

    <tr>
        <td>{{ product.name }}</td>
        <td>{{ product.production_date }}</td>
        <td>{{ product.price }}</td>
    </tr>

    {% empty %}

    <tr>
        <td colspan="3">
            No products available.
        </td>
    </tr>

    {% endfor %}

</table>

{% endblock %}
